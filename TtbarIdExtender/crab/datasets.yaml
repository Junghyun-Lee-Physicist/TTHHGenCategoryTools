  # ===========================================================================
  # 2024 (Run 3, RunIII2024Summer24) -- added 2026-10-15 (docs/01 O10, docs/04 D20)
  # ===========================================================================
  # WHY:   TTHHAnalyzer runs 2024 without a tt+nb lookup (its D-2026-10-05-C):
  #        tt+>=3b stays in tt+B and TT4b has stitch multiplier 0 (plan
  #        AN_NOTT4B). With 2024 patches the analyzer can use plan AN, where
  #        TT4b owns tt+3b / tt+4b (user, 2026-10-15).
  # RELEASE: CMSSW_15_0_X (the v15 area ~/TTHHGenCategoryTools_v15/CMSSW_15_0_18,
  #        el8_amd64_gcc12, inside cmssw-el8). The 10_6 release cannot read this
  #        MiniAOD and has no Run3_2024 era; launch_extend.sh, the preflight and
  #        manager_condor.sh refuse a mismatch (and refuse 2024 together with a
  #        Run 2 era in one call).
  # INPUT: MiniAODv6 parents of the central NanoAODv15 datasets that TTHHAnalyzer
  #        uses (data/samples_2024.json; NtupleForge DAS scan
  #        script/das/das_ttHH_2024_v15_20260923_0851.log). The nano_child lines
  #        are those exact datasets (TTto2L2Nu: -v3; its -v2 is INVALID in DAS).
  #        `dataset:` starts EMPTY on purpose -- no MiniAOD name is guessed:
  #          bash crab/resolve_parents.sh 2024 --fill   # writes the DAS parent into
  #                                                     # each empty dataset: line
  #          bash crab/resolve_parents.sh 2024          # read-only: MATCH 7/7
  #          bash crab/resolve_parents.sh 2024 --apply  # enabled/verified -> true
  #        (launch_extend.sh --era 2024 runs the last two as its steps 4 and 5.)
  # ERA KEY: "2024" is the year= value of run_ttbarIdExtend_cfg.py (era modifier
  #        Run3_2024 alone; run2_nanoAOD_106Xv2 is for the UL years only).
  #        global_tag / era_modifiers are documentation (gen-level pset, no GT).
  # SIZE:  NanoAODv15 1,486,995,493 ev / 3,052 files in total (DAS 2026-09-23);
  #        the MiniAOD file counts (and so the job counts at units_per_job 10)
  #        come from the preflight (--check-das); keep every task below 10,000
  #        jobs (D15) -- the preflight FAILs above it.
  # ===========================================================================
