# =============================================================================
# CRAB dataset catalogue for extend production (Approach 3)
# =============================================================================
# Each enabled entry triggers a CRAB submission of run_ttbarIdExtend_cfg.py over the
# given UL MiniAODv2 input.  The output is a small ROOT TTree ("Events") with
# one row per event holding
#     (run, luminosityBlock, event, genTtbarId, Expanded_genTtbarId, nAddBJets, nAddBJetsMulti).
#
# `nano_child` is the central NanoAODv9 dataset that the MiniAOD parent
# produces.  Comparators (bin/compareExtendToCentral) use it to validate
# byte-identity of `genTtbarId`.
#
# SCOPE: only the ttbar samples that participate in the ttbar categorization
# stitching are listed (3 inclusive 5FS + 3 ttbb 4FS + 1 tt4b = 7).  Each of
# these can contain tt+bbb / tt+4b events hidden inside its tt+bb bucket
# (genTtbarId 53/54/55), so every one needs a extend (Expanded_genTtbarId) for the
# stitching to assign tt+nb consistently.  The signal TTHHTo4b is NOT a
# stitching sample and is intentionally excluded; re-add it only if you want
# to validate the extended sub-codes on signal.
#
# !! MiniAODv2 PARENT VERIFICATION REQUIRED !!
# The MiniAODv2 dataset names below are constructed from the NanoAODv9 names by
# the standard transform (RunIISummer20UL17NanoAODv9 -> RunIISummer20UL17MiniAODv2,
# NANOAODSIM -> MINIAODSIM, same 106X_mc2017_realistic_v9 campaign tag).
# HOWEVER the processing-version suffix (-v1 / -v2) is assigned independently for
# MiniAOD and NanoAOD, so it MUST be confirmed on the grid.  The reliable way is
# the DAS "parent" query against the (known-good) NanoAODv9 child:
#
#   dasgoclient -query="parent dataset=<nano_child>"
#
# A ready-to-run script that prints the true parent for every entry below is in
#   crab/resolve_parents.sh
# Run it on cms01 (with a valid grid proxy) and paste the exact parent string
# into the `dataset:` field if it differs from the constructed name.  Entries
# whose suffix is not yet grid-confirmed must be marked `verified: false`
# (and kept `enabled: false`) until resolve_parents.sh confirms them.
# =============================================================================

eras:

  "2017":
    global_tag: "106X_mc2017_realistic_v9"
    era_modifiers: ["Run2_2017", "run2_nanoAOD_106Xv2"]
    datasets:

      # ======================================================================
      # Dedicated tt4b  ->  provides tt+nb (tt+bbb + tt+4b)
      # ======================================================================
      - name: "TT4b"
        dataset:    "/TT4b_TuneCP5_13TeV_madgraph_pythia8/RunIISummer20UL17MiniAODv2-106X_mc2017_realistic_v9-v2/MINIAODSIM"
        nano_child: "/TT4b_TuneCP5_13TeV_madgraph_pythia8/RunIISummer20UL17NanoAODv9-106X_mc2017_realistic_v9-v2/NANOAODSIM"
        enabled: true
        verified: true
        notes: >
          Dedicated tt4b matrix-element sample.  In the stitching this is the
          source of the tt+nb category: keep events with Expanded_genTtbarId%100 in
          {61,62,71,72} (nAddBJets >= 3), reject the rest.  Populates the
          highest extended sub-codes (71/72).

      # ======================================================================
      # Inclusive ttbar (5FS, powheg)  ->  tt+LF, tt+cc, and the tt+mb tail
      # ======================================================================
      - name: "TTbar_SemiLep"
        dataset:    "/TTToSemiLeptonic_TuneCP5_13TeV-powheg-pythia8/RunIISummer20UL17MiniAODv2-106X_mc2017_realistic_v9-v1/MINIAODSIM"
        nano_child: "/TTToSemiLeptonic_TuneCP5_13TeV-powheg-pythia8/RunIISummer20UL17NanoAODv9-106X_mc2017_realistic_v9-v1/NANOAODSIM"
        enabled: true
        verified: true
        notes: >
          Inclusive ttbar, single-lepton top channel.  Source of tt+LF / tt+cc
          (and tt+mb when ttbb 4FS is not used).  Its tt+bb bucket (53/54/55)
          contains some nAddBJets >= 3 events that must be REJECTED here (tt+nb
          is taken from TT4b), so a extend is required.

      - name: "TTbar_Hadronic"
        dataset:    "/TTToHadronic_TuneCP5_13TeV-powheg-pythia8/RunIISummer20UL17MiniAODv2-106X_mc2017_realistic_v9-v2/MINIAODSIM"
        nano_child: "/TTToHadronic_TuneCP5_13TeV-powheg-pythia8/RunIISummer20UL17NanoAODv9-106X_mc2017_realistic_v9-v1/NANOAODSIM"
        enabled: true
        verified: true
        notes: >
          Inclusive ttbar, fully-hadronic top channel.  The dominant ttbar
          background for the fully-hadronic ttHH(4b) analysis, so this extend
          is essential.  Same role as TTbar_SemiLep: tt+LF / tt+cc / tt+mb,
          with nAddBJets >= 3 events rejected in favour of TT4b.

      - name: "TTbar_DiLep"
        dataset:    "/TTTo2L2Nu_TuneCP5_13TeV-powheg-pythia8/RunIISummer20UL17MiniAODv2-106X_mc2017_realistic_v9-v1/MINIAODSIM"
        nano_child: "/TTTo2L2Nu_TuneCP5_13TeV-powheg-pythia8/RunIISummer20UL17NanoAODv9-106X_mc2017_realistic_v9-v1/NANOAODSIM"
        enabled: true
        verified: true
        notes: >
          Inclusive ttbar, dilepton top channel.  Smaller contribution in the
          fully-hadronic channel but included for stitching completeness so the
          tt+LF/cc/mb labelling is consistent across all three inclusive ttbar
          decay modes.

      # ======================================================================
      # ttbb 4FS (powheg+openloops)  ->  better-modelled tt+b / tt+2b / tt+bb
      # ======================================================================
      - name: "TTbb_SemiLep"
        dataset:    "/TTbb_4f_TTToSemiLeptonic_TuneCP5-Powheg-Openloops-Pythia8/RunIISummer20UL17MiniAODv2-106X_mc2017_realistic_v9-v1/MINIAODSIM"
        nano_child: "/TTbb_4f_TTToSemiLeptonic_TuneCP5-Powheg-Openloops-Pythia8/RunIISummer20UL17NanoAODv9-106X_mc2017_realistic_v9-v1/NANOAODSIM"
        enabled: true
        verified: true
        notes: >
          4-flavour ttbb, single-lepton top channel.  Provides the
          better-modelled tt+b / tt+2b / tt+bb (tt+mb) shapes.  nAddBJets >= 3
          events rejected here (tt+nb from TT4b).  Extend file required.

      - name: "TTbb_Hadronic"
        dataset:    "/TTbb_4f_TTToHadronic_TuneCP5-Powheg-Openloops-Pythia8/RunIISummer20UL17MiniAODv2-106X_mc2017_realistic_v9-v1/MINIAODSIM"
        nano_child: "/TTbb_4f_TTToHadronic_TuneCP5-Powheg-Openloops-Pythia8/RunIISummer20UL17NanoAODv9-106X_mc2017_realistic_v9-v1/NANOAODSIM"
        enabled: true
        verified: true
        notes: >
          4-flavour ttbb, fully-hadronic top channel (campaign label TTbb_4f).
          The 4FS tt+mb source for the fully-hadronic ttHH(4b) analysis, so
          essential alongside TTbar_Hadronic.

      - name: "TTbb_DiLep"
        dataset:    "/TTbb_4f_TTTo2L2Nu_TuneCP5-Powheg-Openloops-Pythia8/RunIISummer20UL17MiniAODv2-106X_mc2017_realistic_v9-v1/MINIAODSIM"
        nano_child: "/TTbb_4f_TTTo2L2Nu_TuneCP5-Powheg-Openloops-Pythia8/RunIISummer20UL17NanoAODv9-106X_mc2017_realistic_v9-v1/NANOAODSIM"
        enabled: true
        verified: true
        notes: >
          4-flavour ttbb, dilepton top channel.  Included for stitching
          completeness so the 4FS tt+mb labelling is consistent across decay
          modes.

  # ===========================================================================
  # 2018 UL  (added 2026-07-26)
  # ===========================================================================
  # STATE: nano_child paths are DAS-CONFIRMED -- they are exactly the datasets
  #        found by NtupleForge/script/das_ul18_scan.sh (log
  #        NtupleForge/script/das_ul18_scan_20260726_1657.log) and used by
  #        NtupleForge/crabConfig/config_ttHH2018UL.yaml, so the extend output
  #        will match the ntuple population by construction.
  # [2026-07-27] RESOLVED AND SUBMITTED. All 7 entries below carry the exact
  #        MiniAODv2 parent returned by `bash crab/resolve_parents.sh 2018`
  #        and are enabled:true / verified:true. The 7-task CRAB campaign covers
  #        20,953 MiniAOD FILES. Job count depends on units_per_job: the first
  #        2026-07-27 submission ran at 1 (= 20,953 jobs) and TTbar_SemiLep was
  #        SUBMITREFUSED for exceeding CRAB's 10,000 jobs/task limit (T-19); the
  #        campaign was then re-submitted in full at units_per_job 10
  #        (= 2,097 jobs). See docs/04_decisions.md D15.
  #        Asymmetric -vN suffixes are real and must NOT be "corrected":
  #          2018 TTbar_SemiLep : MiniAOD -v2 vs Nano -v1
  #          2017 TTbar_Hadronic: MiniAOD -v2 vs Nano -v1
  # ACTION WHEN ADDING A NEW ERA (docs/05_architecture.md sec.5):
  #        keep every new entry enabled:false, run
  #        `bash crab/resolve_parents.sh <ERA>`, paste each "PARENT (from DAS)"
  #        string into `dataset:`, then flip verified:true and enabled:true
  #        per entry. Never assume the -vN suffix from the nano child.
  # NOTE:  era key "2018" alone gives non-colliding CRAB requestNames
  #        (<name>_2018_extend) and a separate outLFNDirBase (.../2018/),
  #        so the completed 2017 production is untouched.
  # ===========================================================================
  "2018":
    global_tag: "106X_upgrade2018_realistic_v16_L1v1"
    era_modifiers: ["Run2_2018", "run2_nanoAOD_106Xv2"]
    datasets:

      - name: "TT4b"
        dataset:    "/TT4b_TuneCP5_13TeV_madgraph_pythia8/RunIISummer20UL18MiniAODv2-106X_upgrade2018_realistic_v16_L1v1-v2/MINIAODSIM"
        nano_child: "/TT4b_TuneCP5_13TeV_madgraph_pythia8/RunIISummer20UL18NanoAODv9-106X_upgrade2018_realistic_v16_L1v1-v2/NANOAODSIM"
        enabled: true
        verified: true
        notes: >
          Dedicated tt4b, 2018UL.  Same role as the 2017 entry: sole source of
          the tt+nb category (Expanded_genTtbarId%100 in {61,62,71,72}).
          Nano child has 9,844,000 events (DAS 2026-07-26); the 2017 twin had
          9,502,000, so the 61/62/71/72 counts will NOT reproduce the 2017
          numbers (2017: 1,882,170 tt+nb rows = 1,585,810 bbb + 296,360 4b) -
          do not reuse the 2017 expected-count table as a 2018 acceptance test.
          MiniAOD suffix unverified -> run resolve_parents.sh 2018.

      - name: "TTbar_SemiLep"
        dataset:    "/TTToSemiLeptonic_TuneCP5_13TeV-powheg-pythia8/RunIISummer20UL18MiniAODv2-106X_upgrade2018_realistic_v16_L1v1-v2/MINIAODSIM"
        nano_child: "/TTToSemiLeptonic_TuneCP5_13TeV-powheg-pythia8/RunIISummer20UL18NanoAODv9-106X_upgrade2018_realistic_v16_L1v1-v1/NANOAODSIM"
        enabled: true
        verified: true
        # MANDATORY OVERRIDE -- do not set this back to 1.
        #
        # WHY 1 IS IMPOSSIBLE: this MiniAOD has 10,010 files, so units_per_job:1
        # splits into 10,010 jobs -- over CRAB's hard ceiling of 10,000 jobs per
        # task. CRAB does not reject that at submit time: the client reports a
        # successful submit and the SERVER then parks the task as SUBMITREFUSED
        # with "The splitting on your task generated 10010 jobs. The maximum
        # number of jobs in each task is 10000". Nothing ever runs and
        # `crab resubmit` cannot rescue it (2026-07-27; docs/08 T-19).
        #
        # WHY 10 AND NOT THE MINIMAL 2: grouping is physics-neutral here. Each
        # job writes (run, luminosityBlock, event, ...) rows and the consumer
        # (matchTtbarId / matchTtbarIdSorted) builds one 3-key map over the whole
        # filelist -- it never looks at which file a row came from. So file->job
        # packing is purely an operations knob, and 1 was a bad setting:
        #   upj  jobs     ~runtime/job   startup share of walltime
        #    1   10,010    2.4 min       ~63%   <- refused anyway
        #    2    5,005    3.3 min       ~45%
        #   10    1,001   10.7 min       ~14%   <- chosen
        # (measured: ~55 s of real work per ~47.6k-event MiniAOD file, ~90 s
        # CMSSW/stage-in startup; walltime cap is 1440 min, so 10 is nowhere
        # near it.) This is exactly the fix CRAB itself keeps asking for in its
        # "average jobs CPU efficiency is less than 50%" warning -- at upj:1 the
        # 2026-07-27 tasks ran at 20-45% CPU eff with 50-58% waste.
        # Bonus: 1,001 output files instead of 10,010 makes the later
        # sortSplitExtend / matchTtbarIdSorted pass materially cheaper.
        #
        # For scale: across these 7 samples MiniAOD/NanoAOD file ratio is ~22.5
        # (10,010/391 = 25.6 here), so 10 MiniAOD files is still well under one
        # NanoAOD file's worth of events.
        #
        # This now MATCHES the campaign default (site_config.yaml
        # resources.extend.units_per_job: 10), so it is technically redundant.
        # It is kept ON PURPOSE as a floor: this is the one dataset that
        # provably CANNOT run at 1, so if anyone ever lowers the global default
        # this entry still survives. (`--preflight --check-das` would also FAIL
        # on it, but a config that cannot break beats a check that catches it.)
        units_per_job: 10
        notes: >
          Inclusive ttbar SL, 2018UL.  LARGEST sample: nano child has
          476,408,000 events (2017: 346,052,000), i.e. ~38% more than the 2017
          case that already required the external-sort validation path.  Plan
          sortSplitExtend + matchTtbarIdSorted for this one (the in-memory
          matchTtbarId map would need well over 11 GB).
          MiniAOD has 10,010 files -> units_per_job: 10 (1,001 jobs). 1 is
          impossible (exceeds the 10,000 jobs/task CRAB limit) and 2 would work
          but keeps the poor CPU efficiency; see the comment above.

      - name: "TTbar_Hadronic"
        dataset:    "/TTToHadronic_TuneCP5_13TeV-powheg-pythia8/RunIISummer20UL18MiniAODv2-106X_upgrade2018_realistic_v16_L1v1-v1/MINIAODSIM"
        nano_child: "/TTToHadronic_TuneCP5_13TeV-powheg-pythia8/RunIISummer20UL18NanoAODv9-106X_upgrade2018_realistic_v16_L1v1-v1/NANOAODSIM"
        enabled: true
        verified: true
        notes: >
          Inclusive ttbar FH, 2018UL.  Nano child 334,206,000 events
          (2017: 232,999,999) -> sorted validation path required.
          The 2017 entry is the known asymmetric case (MiniAOD -v2 / Nano -v1),
          so this suffix in particular must be DAS-resolved, not assumed.

      - name: "TTbar_DiLep"
        dataset:    "/TTTo2L2Nu_TuneCP5_13TeV-powheg-pythia8/RunIISummer20UL18MiniAODv2-106X_upgrade2018_realistic_v16_L1v1-v1/MINIAODSIM"
        nano_child: "/TTTo2L2Nu_TuneCP5_13TeV-powheg-pythia8/RunIISummer20UL18NanoAODv9-106X_upgrade2018_realistic_v16_L1v1-v1/NANOAODSIM"
        enabled: true
        verified: true
        notes: >
          Inclusive ttbar DL, 2018UL.  Nano child 145,020,000 events
          (2017: 106,724,000) -> sorted validation path required.
          MiniAOD suffix unverified -> run resolve_parents.sh 2018.

      - name: "TTbb_SemiLep"
        dataset:    "/TTbb_4f_TTToSemiLeptonic_TuneCP5-Powheg-Openloops-Pythia8/RunIISummer20UL18MiniAODv2-106X_upgrade2018_realistic_v16_L1v1-v1/MINIAODSIM"
        nano_child: "/TTbb_4f_TTToSemiLeptonic_TuneCP5-Powheg-Openloops-Pythia8/RunIISummer20UL18NanoAODv9-106X_upgrade2018_realistic_v16_L1v1-v1/NANOAODSIM"
        enabled: true
        verified: true
        notes: >
          4FS ttbb SL, 2018UL.  Nano child 10,378,681 events (2017: 7,318,891)
          -> small enough for the in-memory matchTtbarId path.
          MiniAOD suffix unverified -> run resolve_parents.sh 2018.

      - name: "TTbb_Hadronic"
        dataset:    "/TTbb_4f_TTToHadronic_TuneCP5-Powheg-Openloops-Pythia8/RunIISummer20UL18MiniAODv2-106X_upgrade2018_realistic_v16_L1v1-v1/MINIAODSIM"
        nano_child: "/TTbb_4f_TTToHadronic_TuneCP5-Powheg-Openloops-Pythia8/RunIISummer20UL18NanoAODv9-106X_upgrade2018_realistic_v16_L1v1-v1/NANOAODSIM"
        enabled: true
        verified: true
        notes: >
          4FS ttbb FH, 2018UL.  Nano child 8,049,064 events (2017: 5,694,656)
          -> in-memory path.  MiniAOD suffix unverified.

      - name: "TTbb_DiLep"
        dataset:    "/TTbb_4f_TTTo2L2Nu_TuneCP5-Powheg-Openloops-Pythia8/RunIISummer20UL18MiniAODv2-106X_upgrade2018_realistic_v16_L1v1-v1/MINIAODSIM"
        nano_child: "/TTbb_4f_TTTo2L2Nu_TuneCP5-Powheg-Openloops-Pythia8/RunIISummer20UL18NanoAODv9-106X_upgrade2018_realistic_v16_L1v1-v1/NANOAODSIM"
        enabled: true
        verified: true
        notes: >
          4FS ttbb DL, 2018UL.  Nano child 4,792,850 events (2017: 3,472,503)
          -> in-memory path; smallest sample, use it for the first smoke test
          (--max-files 5) and the first matchTtbarId run.
