  # ===========================================================================
  # 2022, 2022EE, 2023, 2023BPix (Run 3, NanoAODv12) -- added 2026-11-06
  # (TTHHAnalyzer STEP 47, docs/04_decisions.md D25)
  # ===========================================================================
  # WHY:   the 2022-23 tt+nb lookups (format 3, docs/07 sec.5.5) are extracted
  #        from sidecars that carry the generator fingerprint Generator_x1/x2/
  #        id1/id2 (TtbarIdExtender 870445b): one central NanoAODv12 dataset
  #        can hold two different events with the same (run, lumi, event), and
  #        only the fingerprint tells them apart.
  # TASKS: exactly the 39 rows of the lxplus plan (2026-11-06, DAS read then),
  #        in its row order: TTHHAnalyzer docs/claude-remote/daily/lxplus/files/
  #        2026-11-04_dup_scan/2026-11-06_step46_check/crab_plan_2022-23.tsv
  #        (md5 5de5ac33e28a37d9ce908bc8354f3548). verified: true = lxplus
  #        resolved every MiniAOD / NanoAODv12 pair in DAS on 2026-11-06.
  #          2022, 2022EE  each NanoAODv12 dataset (main and ext1) with its
  #                        MiniAODv4 parent (20 tasks), and for five main
  #                        datasets also the MiniAODv3 parent of the events
  #                        whose MiniAODv4 parent is gone (5 tasks, each over
  #                        the lumis of its mask only)
  #          2023, 2023BPix  MiniAODv4 only (14 tasks)
  #        So one `name` can have up to three entries in an era (main v4, main
  #        v3, ext1 v4); `name` + era is no longer a task. The submitter takes
  #        the task identity from the fields below.
  # NEW ENTRY FIELDS (these eras only; the submitter checks them):
  #   nano_role:       main | ext1 -- the NanoAODv12 dataset (nano_child) the
  #                    task's events belong to; a v3 task belongs to the MAIN one.
  #   miniaod_version: v4 | v3 -- the MiniAOD campaign of `dataset:`. It picks
  #                    the campaign prefix of the preflight, the extract priority
  #                    of the task table (v4 0, v3 1; extractTtbarIdPatch keeps
  #                    the lower number) and the request label (v3 -> "v3",
  #                    v4 -> its nano_role).
  #   lumi_mask:       v3 only -- crab_lumimask_<era>_<name>_v3.json, a file
  #                    in crab/lumimasks/ (byte-identical copies of lxplus's
  #                    2026-11-05 masks); Data.lumiMask = its absolute path.
  #                    v4 entries have none.
  #   lumi_mask_md5:   v3 only -- md5 of that file. Another file name, a missing
  #                    file, another md5 or a mask with 0 lumis refuses the
  #                    task, and the run submits nothing.
  # NEW ERA FIELDS:
  #   pset_year: "2024" -- the year= of run_ttbarIdExtend_cfg.py, whose year
  #              option knows 2016/2016APV/2017/2018/2024 only (the pset is not
  #              changed). The job is gen level and none of its modules is
  #              era-modified; lxplus ran year=2024 on 2022-23 MiniAODv4 files
  #              (CMSSW_15_0_18, 2026-11-06) and the ids and the fingerprint
  #              matched NanoAOD bit for bit. The preflight checks this value.
  #   request_name_suffix: "fp" -- requestName (= outputDatasetTag) is
  #              <name>_<era>_<main|ext1|v3>_extend_fp, the plan's request_name.
  # global_tag / era_modifiers are documentation (gen-level pset, no GlobalTag);
  #        era_modifiers is what the job applies (year=2024 -> Run3_2024), not
  #        the campaign's own era.
  # RELEASE: CMSSW_15_0_X (cmssw-el8), like 2024; one call may mix these eras
  #        with 2024, never with a Run 2 era.
  # SIZE:  valid MiniAOD files (the plan's DAS summary): 2022 13,254 (v3
  #        4,138), 2022EE 44,176 (v3 15,523), 2023 9,409, 2023BPix 4,893 =
  #        71,732; a v3 task splits only the files with a masked lumi. At
  #        units_per_job 10: at most 7,193 jobs in all, the largest task 2022EE
  #        TTbar_SemiLep ext1 (8,801 files -> 881 jobs, + CRAB block
  #        boundaries) -- far below 10,000 per task (D15).
  # OTHER TOOLS: launch_extend.sh and manager_condor.sh refuse these eras
  #        (unknown era); extend_manager.py refuses all four (it keys tasks by
  #        era/name and checks whole-dataset event counts) and points to
  #        TtbarIdExtender/README.md sec.2.2f -- these eras are submitted and
  #        watched (--report) with submit_ttbarIdExtend.py only;
  #        resolve_parents.sh does not know them (the pairs come from lxplus's
  #        DAS work). crab/check_sidecar_lumimask.py checks finished v3 tasks.
  # ===========================================================================
  "2022":
    global_tag: "130X_mcRun3_2022_realistic_v5 (MiniAODv3 parents: 124X_mcRun3_2022_realistic_v12)"
    era_modifiers: ["Run3_2024"]
